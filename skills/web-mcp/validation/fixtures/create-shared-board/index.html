<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Board — WebMCP CREATE fixture</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f8fafc; }
      main { width: min(42rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #334155; border-radius: 1rem; background: #172033; box-shadow: 0 1rem 4rem #0006; }
      header, form, .metadata { display: flex; gap: .75rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
      h1 { margin: 0; letter-spacing: -.04em; }
      .metadata { color: #a5b4fc; font-variant-numeric: tabular-nums; }
      ul { min-height: 8rem; padding: 0; list-style: none; display: grid; gap: .5rem; }
      li { padding: .75rem 1rem; border-radius: .65rem; background: #243049; }
      input, button { font: inherit; padding: .75rem 1rem; border-radius: .65rem; border: 1px solid #475569; }
      input { flex: 1 1 16rem; background: #0f172a; color: inherit; }
      button { background: #818cf8; color: #111827; font-weight: 700; cursor: pointer; }
      #activity { min-height: 1.5em; color: #cbd5e1; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Shared Board</h1>
        <div class="metadata" aria-label="Board status">
          <span>Items: <strong id="item-count">0</strong></span>
          <span>Revision: <strong id="revision">0</strong></span>
        </div>
      </header>
      <p>People and agents add to the same revisioned board through one canonical operation.</p>
      <ul id="board-items" aria-live="polite"></ul>
      <form id="add-item-form">
        <label for="item-title">New item</label>
        <input id="item-title" name="title" required maxlength="120" autocomplete="off">
        <button type="submit">Add item</button>
      </form>
      <p id="activity" role="status">Board ready.</p>
    </main>
    <script type="module" src="./src/ui.mjs"></script>
  </body>
</html>

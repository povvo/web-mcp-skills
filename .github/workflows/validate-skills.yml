name: Validate release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Skill, examples, and install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install skill validation dependencies
        run: python -m pip install -r skills/web-mcp/requirements.txt

      - name: Validate skill structure and references
        run: node .github/scripts/validate-skill.mjs skills

      - name: Run portable skill self-test
        run: python -B skills/web-mcp/scripts/webmcp_toolkit.py self-test --profile full --format text

      - name: Test examples and generated adapters
        run: npm --prefix examples test

      - name: Validate product contracts and deterministic generation
        run: node .github/scripts/validate-examples.mjs

      - name: Validate authored documentation links
        run: node .github/scripts/validate-doc-links.mjs

      - name: Prove skills CLI discovery
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          npx --yes skills@latest --version
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --list

      - name: Smoke-install every discovered skill
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/skills-smoke"
          cd "$RUNNER_TEMP/skills-smoke"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --skill '*' --agent codex --copy --yes
          test -n "$(find .agents/skills -name SKILL.md -type f -print -quit)"
          node "$GITHUB_WORKSPACE/.github/scripts/validate-skill.mjs" .agents/skills

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2400 960"
     width="2400"
     height="960"
     role="img"
     aria-labelledby="title description"
     shape-rendering="geometricPrecision">
  <title id="title">Web MCP repository banner</title>
  <desc id="description">A Web MCP page diagram showing a human interface and a site tool converging on one shared application operation, then updating application state and a visible result.</desc>
  <metadata id="web-mcp-asset-tokens">
    surface.canvas=#0A0A0A; surface.page=#E8E8E4; text.primary=#E8E8E4;
    text.on-page=#0A0A0A; structure.recessive=#3A3A3A; state.current=#0A0A0A
  </metadata>

  <style>
    .display,
    .label,
    .panel-label,
    .panel-title {
      font-family: "JetBrains Mono", ui-monospace, monospace;
    }

    .display {
      fill: #e8e8e4;
      font-size: 294px;
      font-weight: 700;
      letter-spacing: -0.065em;
    }

    .label {
      fill: #e8e8e4;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }

    .panel-label {
      fill: #0a0a0a;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .panel-title {
      fill: #0a0a0a;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .route {
      fill: none;
      stroke: #0a0a0a;
      stroke-width: 10;
      stroke-linecap: square;
      stroke-linejoin: round;
    }

    .node-open {
      fill: #e8e8e4;
      stroke: #0a0a0a;
      stroke-width: 9;
    }

    .node-current {
      fill: #0a0a0a;
    }

    .state-frame {
      fill: none;
      stroke: #0a0a0a;
      stroke-width: 8;
    }
  </style>

  <rect width="2400" height="960" fill="#0a0a0a"/>

  <g aria-hidden="true" fill="none" stroke="#3a3a3a" stroke-width="2">
    <path d="M120 142H1376"/>
    <path d="M120 126V158M1376 126V158"/>
    <path d="M120 832H1376"/>
  </g>

  <g class="label">
    <text x="120" y="92">WEB MCP / PAGE-BOUND TOOLS</text>
    <text x="120" y="884">ONE PAGE · REAL TOOLS · SHARED STATE</text>
    <text x="1500" y="884">DISCOVER · INVOKE · RECONCILE</text>
  </g>

  <text class="display" x="98" y="650">WEB</text>
  <text class="display" x="98" y="856">MCP</text>

  <g>
    <rect x="1460" y="96" width="820" height="736" fill="#e8e8e4"/>
    <path d="M1460 184H2280" fill="none" stroke="#0a0a0a" stroke-width="3"/>
    <circle cx="1502" cy="140" r="8" fill="#0a0a0a"/>
    <text class="panel-label" x="1530" y="148">PAGE / ACTIVE</text>
    <text class="panel-label" x="2240" y="148" text-anchor="end">TOOLS / 02</text>

    <path class="route" d="M1556 344H1740V464H1856"/>
    <path class="route" d="M1556 624H1740V464"/>
    <path class="route" d="M1856 464H1952L2040 376H2168V632"/>

    <circle class="node-open" cx="1556" cy="344" r="25"/>
    <circle class="node-open" cx="1556" cy="624" r="25"/>
    <circle class="node-current" cx="1856" cy="464" r="24"/>
    <circle class="node-open" cx="2040" cy="376" r="25"/>

    <rect class="state-frame" x="2116" y="580" width="104" height="104"/>
    <rect x="2144" y="608" width="48" height="48" fill="#0a0a0a"/>

    <text class="panel-label" x="1556" y="298" text-anchor="middle">HUMAN UI</text>
    <text class="panel-label" x="1556" y="678" text-anchor="middle">SITE TOOL</text>
    <text class="panel-title" x="1856" y="522" text-anchor="middle">SHARED</text>
    <text class="panel-title" x="1856" y="557" text-anchor="middle">OPERATION</text>
    <text class="panel-label" x="2040" y="330" text-anchor="middle">APPLICATION STATE</text>
    <text class="panel-label" x="2168" y="732" text-anchor="middle">VISIBLE RESULT</text>

    <text class="panel-label" x="1510" y="788">DOCUMENT.MODELCONTEXT</text>
    <text class="panel-label" x="2230" y="788" text-anchor="end">SAME OWNER / SAME CONSEQUENCE</text>
